# iOS builds. Start manually from the Codemagic dashboard.
# Expo generates the native project on the build machine (CNG).
workflows:
  ios-unsigned:
    name: Mailroom iOS - Unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24.21.0
      xcode: "26.6"
      cocoapods: default
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - &install-dependencies
        name: Install app and server dependencies
        script: |
          set -eu
          npm ci
          npm ci --prefix server
      - &check-project
        name: Check lint, types and server tests
        script: |
          set -eu
          npm run lint
          npm run typecheck
          npm test
      - &generate-ios
        name: Generate iOS project and install CocoaPods dependencies
        script: |
          set -eu
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Archive unsigned iPhone app
        script: |
          set -eu
          xcodebuild archive \
            -workspace ios/Mailroom.xcworkspace \
            -scheme Mailroom \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mailroom.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package device app as an unsigned IPA for Sideloadly
        script: |
          set -eu
          app_path="build/Mailroom.xcarchive/Products/Applications/Mailroom.app"
          # Catch simulator builds or a missing embedded JS bundle before export.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app_path/Info.plist")" = "iPhoneOS"
          xcrun lipo -verify_arch arm64 "$app_path/Mailroom"
          test -s "$app_path/main.jsbundle"
          mkdir -p build/unsigned/Payload build/artifacts
          ditto "$app_path" build/unsigned/Payload/Mailroom.app
          # IPA is a ZIP with Payload/<App>.app at its root. Do not exportArchive:
          # signing and provisioning happen later in Sideloadly on Windows.
          ditto -c -k --keepParent build/unsigned/Payload build/artifacts/Mailroom-unsigned.ipa
          unzip -t build/artifacts/Mailroom-unsigned.ipa
    artifacts:
      - build/artifacts/Mailroom-unsigned.ipa
      - build/Mailroom.xcarchive/dSYMs/*.dSYM

  ios-simulator:
    name: Mailroom iOS - Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24.21.0
      xcode: "26.6"
      cocoapods: default
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - *install-dependencies
      - *check-project
      - *generate-ios
      - name: Build iOS Simulator app
        script: |
          set -eu
          xcodebuild build \
            -workspace ios/Mailroom.xcworkspace \
            -scheme Mailroom \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Mailroom.app \
            build/artifacts/Mailroom-ios-simulator.zip
    artifacts:
      - build/artifacts/Mailroom-ios-simulator.zip
