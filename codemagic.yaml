# iOS builds. Start manually from the Codemagic dashboard.
# Expo generates the native project on the build machine (CNG).
workflows:
  ios-device:
    name: Mailroom iOS - iPhone (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24.21.0
      xcode: "26.6"
      cocoapods: default
      # Upload an Apple Distribution certificate and a matching Ad Hoc profile
      # in Codemagic Team settings > Code signing identities before building.
      # Keep this identifier aligned with expo.ios.bundleIdentifier in app.json.
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.example.mailroom
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - &install-dependencies
        name: Install app and server dependencies
        script: |
          set -eu
          npm ci
          npm ci --prefix server
      - &check-project
        name: Check lint, types and server tests
        script: |
          set -eu
          npm run lint
          npm run typecheck
          npm test
      - &generate-ios
        name: Generate iOS project and install CocoaPods dependencies
        script: |
          set -eu
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Apply iOS provisioning profiles
        script: |
          set -eu
          xcode-project use-profiles
      - name: Build signed iPhone IPA
        script: |
          set -eu
          xcode-project build-ipa \
            --workspace ios/Mailroom.xcworkspace \
            --scheme Mailroom
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-simulator:
    name: Mailroom iOS - Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24.21.0
      xcode: "26.6"
      cocoapods: default
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - *install-dependencies
      - *check-project
      - *generate-ios
      - name: Build iOS Simulator app
        script: |
          set -eu
          xcodebuild build \
            -workspace ios/Mailroom.xcworkspace \
            -scheme Mailroom \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Mailroom.app \
            build/artifacts/Mailroom-ios-simulator.zip
    artifacts:
      - build/artifacts/Mailroom-ios-simulator.zip
